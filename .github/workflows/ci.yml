name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.welcome=never

jobs:
  # Runs first and on its own: the interrupt engine and the detection matcher are pure JVM,
  # so they need no Android SDK and fail in seconds rather than after a toolchain download.
  core:
    name: Core logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test core modules
        run: ./gradlew :core:model:build :core:domain:test

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/domain/build/reports/tests/**
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Installed explicitly so the versions are pinned and visible, rather than being
      # auto-downloaded mid-build where a failure is harder to attribute.
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # One invocation, one configuration pass, one daemon. Splitting these across separate
      # gradlew calls costs a cold JVM start and a full re-configuration each time.
      - name: Build and test
        run: ./gradlew test lintDebug assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.*
          if-no-files-found: ignore
