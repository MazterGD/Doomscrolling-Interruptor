name: CI

on:
  # Branches with an open pull request are covered by the pull_request trigger; listing them
  # here as well would run every build twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.welcome=never

jobs:
  # Runs first and on its own: the interrupt engine and the detection matcher are pure JVM,
  # so they need no Android SDK and fail in seconds rather than after a toolchain download.
  core:
    name: Core logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test core modules
        run: ./gradlew :core:model:build :core:domain:test

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/domain/build/reports/tests/**
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Installed explicitly so the versions are pinned and visible, rather than being
      # auto-downloaded mid-build where a failure is harder to attribute.
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # One invocation, one configuration pass, one daemon. Splitting these across separate
      # gradlew calls costs a cold JVM start and a full re-configuration each time.
      - name: Build and test
        run: ./gradlew test lintDebug assembleDebug assembleRelease --stacktrace

      # The project's central privacy claim is that this app cannot reach the network,
      # because it never requests INTERNET. Leaving that to the source manifest alone is not
      # enough: the manifest merger folds in permissions declared by any transitive AAR, so a
      # dependency bump could silently grant network access. This asserts it against the
      # *merged* manifests that actually ship in the APK.
      - name: Assert the app cannot reach the network
        run: |
          set -euo pipefail
          manifests=$(find app/build -name AndroidManifest.xml -path '*merged_manifest*')
          if [ -z "$manifests" ]; then
            echo "::error::No merged manifest found — cannot verify the no-network guarantee"
            exit 1
          fi
          echo "Merged manifests checked:"; echo "$manifests"
          if grep -l 'android.permission.INTERNET' $manifests; then
            # Name the culprit rather than just failing: the merger report records which
            # dependency contributed each element.
            echo "--- manifest merger provenance for INTERNET ---"
            grep -B2 -A6 -i 'permission.INTERNET' app/build/outputs/logs/manifest-merger-*-report.txt || true
            echo "::error::INTERNET permission survived into the merged manifest. A dependency contributed it and the tools:node=\"remove\" guard in AndroidManifest.xml did not strip it. This breaks the project's core privacy guarantee."
            exit 1
          fi
          echo "OK: no INTERNET permission in any merged manifest."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.*
          if-no-files-found: ignore
