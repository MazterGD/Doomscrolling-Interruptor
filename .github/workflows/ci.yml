name: CI

on:
  # Branches with an open pull request are covered by the pull_request trigger; listing them
  # here as well would run every build twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.welcome=never

jobs:
  # Runs first and on its own: the interrupt engine and the detection matcher are pure JVM,
  # so they need no Android SDK and fail in seconds rather than after a toolchain download.
  core:
    name: Core logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test core modules
        run: ./gradlew :core:model:build :core:domain:test

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/domain/build/reports/tests/**
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Installed explicitly so the versions are pinned and visible, rather than being
      # auto-downloaded mid-build where a failure is harder to attribute.
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # One invocation, one configuration pass, one daemon. Splitting these across separate
      # gradlew calls costs a cold JVM start and a full re-configuration each time.
      - name: Build and test
        run: ./gradlew test lintDebug assembleDebug assembleRelease --stacktrace

      # The project's central privacy claim is that this app cannot reach the network, because
      # it never holds INTERNET. Reading the source manifest would not establish that — the
      # merger folds in permissions declared by any dependency — and grepping the merged XML
      # is worse still, because it matches prose inside comments as readily as real elements.
      #
      # So this asks the built artifact what it actually declares. aapt2 reports the permissions
      # a device would grant, which is the only thing that matters.
      - name: Assert the app cannot reach the network
        run: |
          set -euo pipefail
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if [ -z "$aapt2" ]; then
            echo "::error::aapt2 not found — cannot verify the no-network guarantee"
            exit 1
          fi

          apks=$(find app/build/outputs/apk -name '*.apk')
          if [ -z "$apks" ]; then
            echo "::error::No APK found — cannot verify the no-network guarantee"
            exit 1
          fi

          failed=0
          for apk in $apks; do
            echo "== $apk"
            perms=$("$aapt2" dump permissions "$apk")
            echo "${perms:-  (declares no permissions)}"
            if printf '%s' "$perms" | grep -q 'android\.permission\.INTERNET'; then
              echo "::error::$apk declares android.permission.INTERNET. This app must never hold the network permission — see the privacy section of the README."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]
          echo "OK: no APK declares the INTERNET permission."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.*
          if-no-files-found: ignore
